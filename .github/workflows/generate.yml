name: Regenerate from OpenAPI spec
# One spec, one way. hanzoai/openapi fires `spec-update` on every hanzo.yaml
# change; this regenerates the SDK and opens a PR. Never hand-edit the
# generated *.go — edit the per-service spec in hanzoai/openapi.
on:
  repository_dispatch:
    types: [spec-update]
  workflow_dispatch:

jobs:
  generate:
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Regenerate
        run: ./scripts/generate.sh
      - name: Verify it builds
        run: go build ./...
      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: codegen/spec-update
          title: 'chore: regenerate from openapi hanzo.yaml'
          commit-message: 'chore: regenerate from openapi hanzo.yaml'
          body: Automated regeneration from hanzoai/openapi `hanzo.yaml`.
