name: Release
# Publishing a Go module is pushing a semver tag — there is no registry to
# upload to and no token to hold. pkg.go.dev indexes the tag through the module
# proxy; this build proves the tag compiles and then warms the proxy so the
# version goes live immediately instead of on first request.
#
# The path is READ from go.mod rather than written here. go.mod is what defines
# it -- a second spelling in this file is a second thing to move, and the one
# that gets missed: the module gained its /v8 suffix and a hardcoded warm step
# would have gone on asking the proxy for a path nobody publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: [linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -count=1 ./...
      - name: Warm the module proxy
        # `go list -m` on the module's own path at the pushed tag. The proxy
        # fetches it, which is what makes the version live rather than live on
        # somebody's first request -- and it FAILS when the tag is one the proxy
        # will not serve, which a bare path's v8 tag is.
        run: |
          set -euo pipefail
          MODULE=$(go list -m)
          echo "warming ${MODULE}@${GITHUB_REF_NAME}"
          GOPROXY=proxy.golang.org go list -m "${MODULE}@${GITHUB_REF_NAME}"
